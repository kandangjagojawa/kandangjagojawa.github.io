gital-jawa/",tags:["BAHASA","BUDAYA","EDUKASI"],icon:"\uD83D\uDDC2️",desc:"Berbeda dengan KAMUS WEB, aplikasi ini bisa mencari sembarang kata yang ditulis dalam Bahasa Indonesia ATAU Bahasa Jawa! Cari langsung dari 3 database kamus sekaligus - lebih lengkap, lebih pintar, lebih jangkau semua makna dari ngoko hingga krama inggil. Satu kata, tiga sumber, hasil maksimal!",gradient:"linear-gradient(135deg,#1A3C34,#43A047)",solid:"#1A3C34",solid2:"#43A047",aksara:"ꦏꦩꦸꦱ꧀ꦭꦼꦁꦏꦥ꧀",cta:"Buka Kamus Lengkap →",note:"Beda dengan KAMUS WEB - bisa cari kata Indonesia atau Jawa dari 3 database kamus sekaligus! Lebih lengkap dan pintar."},{id:"hapal-pasangan",title:"MENGHAPAL PASANGAN AKSARA JAWA",url:"https://kandangjagojawa.github.io/hapal-pasangan/",secondaryUrl:"https://kandangjagojawa.github.io/hapal-pasangan/index2.html",secondaryTitle:"Font Noto Sans Javanese",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83D\uDD17",desc:"Game khusus untuk menghapal pasangan aksara Jawa! Pasangan itu yang bikin bingung kan? Di game ini kamu akan ditempa hafal semua pasangan dari Pa sampai Ha, lengkap dengan aturan pemakaiannya. Main sambil hapal, lama-lama pasangan bukan lagi musuh tapi jadi sahabat nulis!",gradient:"linear-gradient(135deg,#4E342E,#FFAB91)",solid:"#4E342E",solid2:"#FFAB91",aksara:"ꦥꦱꦔꦤ꧀",cta:"Hapal Pasangan →",isNew:!0,note:"Game khusus untuk menghapal pasangan aksara Jawa - dari Pa sampai Ha, bikin pasangan jadi sahabat bukan musuh!"},{id:"chemistry-aksara",title:"CHEMISTRY AKSARA JAWA",url:"https://kandangjagojawa.github.io/aksara-chemistry/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83E\uDDEA",desc:"Game jatuhkan aksara dan sandhangan agar bertabrakan dan bereaksi menjadi suku kata baru! Geser untuk mengarahkan, lepas atau tekan JATUHKAN. Selesaikan semua rumus yang ada! Seperti kimia sungguhan, Ha + Wulu = Hi, Ka + Suku = Ku - gabungkan elemen aksara dan lihat reaksinya meledak jadi kata baru! Seru, bikin nagih, dan diam-diam hapal aksara!",gradient:"linear-gradient(135deg,#0D1B2A,#00BFA5)",solid:"#0D1B2A",solid2:"#00BFA5",aksara:"ꦏꦶꦩꦶꦪ",cta:"Mulai Reaksi →",isNew:!0,note:"Jatuhkan aksara & sandhangan agar bertabrakan jadi suku kata baru. Geser, lepas, JATUHKAN! Selesaikan rumusnya!"},{id:"kartu-memori",title:"KARTU MEMORI",url:"https://kandangjagojawa.github.io/kartu-memori/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83C\uDFB4",desc:"Game mencocokkan kartu untuk melatih ingatan dan kecepatan berpikir! Balik dua kartu, cari pasangan aksara Jawa yang sama. Semakin cepat mencocokkan semua pasangan, semakin tinggi skormu! Cocok untuk melatih konsentrasi, ingatan, sekaligus hapal bentuk aksara Jawa tanpa terasa seperti belajar. Main sendiri atau tantang teman!",gradient:"linear-gradient(135deg,#6A1B9A,#F06292)",solid:"#6A1B9A",solid2:"#F06292",aksara:"ꦩꦼꦩꦺꦴꦫꦶ",cta:"Main Memori →",isNew:!0,note:"Cocokkan pasangan kartu aksara yang sama! Latih ingatan, konsentrasi, dan hapal aksara dalam satu game seru."},{id:"alih-aksara-kawi",title:"ALIH AKSARA LATIN - KAWI",url:"https://kandangjagojawa.github.io/alih-aksara-kawi/",secondaryUrl:"https://kandangjagojawa.github.io/latin-ke-kawi/",secondaryTitle:"Latin ke Kawi V2",tags:["AKSARA","BAHASA","EDUKASI"],icon:"\uD83C\uDFDB️",desc:"Alih aksara keren dari huruf Latin ke Aksara Kawi! Ketik Latin, langsung jadi aksara Kawi kuno yang gagah. Tata tulis sudah sesuai dengan tata tulis aksara Kawi asli - bukan asal convert! Rasakan sensasi menulis seperti pujangga zaman Mataram Kuno, prasasti-prasasti bersejarah hidup kembali di ujung jarimu!",gradient:"linear-gradient(135deg,#1A1A2E,#16213E)",solid:"#1A1A2E",solid2:"#16213E",aksara:"ꦏꦮꦶ",cta:"Alih ke Kawi V1 →",isNew:!0,note:"Latin ke Aksara Kawi asli - tata tulis sesuai kaidah Kawi kuno, prasasti hidup kembali!"},{id:"hapal-pasangan-kawi",title:"MENGHAPAL PASANGAN KAWI",url:"https://kandangjagojawa.github.io/hapal-pasangan-kawi/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83D\uDCDC\uD83D\uDD17",desc:"Sama serunya dengan MENGHAPAL PASANGAN, tapi sekarang versi KAWI! Taklukkan pasangan aksara Kawi yang lebih kuno dan menantang - dari prasasti ke prasasti, dari kerajaan ke kerajaan! Kalau kamu sudah jago pasangan Jawa, buktikan kehebatanmu di level dewa: Pasangan Kawi! Main sambil jadi epigrapher, lama-lama baca prasasti kuno tanpa kamus!",gradient:"linear-gradient(135deg,#2C1810,#8E24AA)",solid:"#2C1810",solid2:"#8E24AA",aksara:"ꦥꦱꦔꦤ꧀ꦏꦮꦶ",cta:"Hapal Pasangan Kawi →",isNew:!0,note:"Versi Kawi dari game hapal pasangan - taklukkan pasangan aksara Kawi kuno, level dewa untuk pembaca prasasti!"},{id:"takdir-kraton",title:"TAKDIR KRATON",url:"https://kandangjagojawa.github.io/takdir-kraton/",tags:["BUDAYA","GAME"],icon:"\uD83D\uDC51",desc:"Penasaran jadi apa kamu kalau hidup di zaman Kerajaan Kuno Nusantara? Game Takdir Kraton akan membongkar takdirmu! Apakah kamu seorang Prajurit gagah penjaga kerajaan, Pujangga istana, Pedagang kaya, Petani, Empu pembuat keris sakti, atau bahkan Raja? Masukkan namamu, putar roda takdir, dan lihat pekerjaanmu di era Majapahit, Mataram, Singasari! Seru, bikin ngakak, dan bikin bangga jadi keturunan Nusantara!",gradient:"linear-gradient(135deg,#4E2600,#FFC107)",solid:"#4E2600",solid2:"#FFC107",aksara:"ꦠꦏ꧀ꦢꦶꦂ",cta:"Cek Takdirmu →",isNew:!0,note:"Cek takdirmu di zaman Kerajaan Kuno! Jadi Prajurit, Empu, Pedagang, atau Raja? Putar roda takdir kraton!"},{id:"alih-aksara-kbj",title:"PAUGERAN KBJ",url:"https://kandangjagojawa.github.io/kbj/",tags:["AKSARA","BAHASA","EDUKASI"],icon:"\uD83D\uDCD8",desc:"Alih aksara Latin ke Aksara Jawa berdasarkan Paugeran KBJ 1996! Hasil Kongres Bahasa Jawa di Malang yang disepakati 3 Gubernur Jateng-Jatim-DIY. Paugeran yang dipakai di sekolah - lebih sederhana, konsisten, mudah dipelajari. Cocok untuk pelajar & umum yang mau nulis aksara Jawa sesuai standar resmi! Ketik Latin, langsung jadi aksara Jawa KBJ yang benar!",gradient:"linear-gradient(135deg,#1565C0,#64B5F6)",solid:"#1565C0",solid2:"#64B5F6",aksara:"ꦏꦨꦗ",cta:"Alih KBJ →",isNew:!0,note:"Standar resmi KBJ 1996 Kongres Bahasa Jawa Malang - SKB 3 Gubernur, paugeran sekolah!"},{id:"komparasi",title:"MEMBANDINGKAN 3 TATA TULIS",url:"https://kandangjagojawa.github.io/komparasi/",tags:["AKSARA","BAHASA","EDUKASI"],icon:"⚖️",desc:"Bingung bedanya Sriwedari, KBJ, dan Mardi Kawi? Aplikasi ini membandingkan 3 tata tulis aksara Jawa sekaligus dalam satu layar! Ketik satu kalimat Latin, langsung lihat hasilnya dalam Paugeran Sriwedari 1926 (klasik Solo), Paugeran KBJ 1996 (standar sekolah resmi SKB 3 Gubernur), dan Mardi Kawi (gaya Kawi kuno). Bandingkan sandhangan, pasangan, murda - mana yang paling cocok untukmu? Wajib untuk peneliti, guru, dan pecinta aksara!",gradient:"linear-gradient(135deg,#102027,#FF6F00)",solid:"#102027",solid2:"#FF6F00",aksara:"ꦧꦤ꧀ꦝꦶꦁ",cta:"Bandingkan →",isNew:!0,note:"Bandingkan Sriwedari vs KBJ vs Mardi Kawi dalam satu layar - ketik sekali, lihat 3 versi!"}],rc=[{id:"tata-tulis",title:"TATA TULIS, ALIH-AKSARA, TRANSLITERASI",aksara:"ꦠꦠꦠꦸꦭꦶꦱ꧀ • ꦄꦭꦶꦃꦲꦏ꧀ꦱꦫ",desc:"5 karya: Sriwedari 1926, KBJ 1996, Mardi Kawi, Latin-Kawi & Komparasi 3 Tata Tulis",ids:["alih-aksara-sriwedari","alih-aksara-kbj","tata-tulis-cara-kawi","alih-aksara-kawi","komparasi"]},{id:"aksara-jawa",title:"PERMAINAN EDUKATIF AKSARA JAWA",aksara:"ꦢꦺꦴꦭꦤꦤ꧀ꦲꦏ꧀ꦱꦫꦗꦮ",desc:"11 game seru untuk hapal, susun, & mahir Aksara Jawa",ids:["tembak-aksara","hapal-pasangan","pasar-aksara","susun-aksara","chemistry-aksara","sliding-puzzle","kartu-memori","duel-aksara","dora-sembada","tarik-tambang","nulis-pitutur"]},{id:"aksara-kawi",title:"PERMAINAN EDUKATIF AKSARA KAWI",aksara:"ꦢꦺꦴꦭꦤꦤ꧀ꦲꦏ꧀ꦱꦫꦏꦮꦶ",desc:"Hapal Aksara Kawi & pasangannya, level dewa epigrafi",ids:["tembak-kawi","hapal-pasangan-kawi"]},{id:"bahasa-budaya",title:"BAHASA DAN BUDAYA",aksara:"ꦧꦱꦭꦤ꧀ꦧꦸꦢꦪ",desc:"Walikan, pitutur luhur, & kamus lengkap A-Z",ids:["walikan","pitutur-jawa","kamus-web","kamus-lengkap"]},{id:"waktu-luang",title:"PERMAINAN WAKTU LUANG",aksara:"ꦢꦺꦴꦭꦤꦤ꧀ꦱꦤ꧀ꦠꦻ",desc:"KTP Jawa, tafsir watak, titisan tokoh & takdir kraton",ids:["ktp-
