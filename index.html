gital-jawa/",tags:["BAHASA","BUDAYA","EDUKASI"],icon:"\uD83D\uDDC2️",desc:"Berbeda dengan KAMUS WEB, aplikasi ini bisa mencari sembarang kata yang ditulis dalam Bahasa Indonesia ATAU Bahasa Jawa! Cari langsung dari 3 database kamus sekaligus - lebih lengkap, lebih pintar, lebih jangkau semua makna dari ngoko hingga krama inggil. Satu kata, tiga sumber, hasil maksimal!",gradient:"linear-gradient(135deg,#1A3C34,#43A047)",solid:"#1A3C34",solid2:"#43A047",aksara:"ꦏꦩꦸꦱ꧀ꦭꦼꦁꦏꦥ꧀",cta:"Buka Kamus Lengkap →",note:"Beda dengan KAMUS WEB - bisa cari kata Indonesia atau Jawa dari 3 database kamus sekaligus! Lebih lengkap dan pintar."},{id:"hapal-pasangan",title:"MENGHAPAL PASANGAN AKSARA JAWA",url:"https://kandangjagojawa.github.io/hapal-pasangan/",secondaryUrl:"https://kandangjagojawa.github.io/hapal-pasangan/index2.html",secondaryTitle:"Font Noto Sans Javanese",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83D\uDD17",desc:"Game khusus untuk menghapal pasangan aksara Jawa! Pasangan itu yang bikin bingung kan? Di game ini kamu akan ditempa hafal semua pasangan dari Pa sampai Ha, lengkap dengan aturan pemakaiannya. Main sambil hapal, lama-lama pasangan bukan lagi musuh tapi jadi sahabat nulis!",gradient:"linear-gradient(135deg,#4E342E,#FFAB91)",solid:"#4E342E",solid2:"#FFAB91",aksara:"ꦥꦱꦔꦤ꧀",cta:"Hapal Pasangan →",isNew:!0,note:"Game khusus untuk menghapal pasangan aksara Jawa - dari Pa sampai Ha, bikin pasangan jadi sahabat bukan musuh!"},{id:"chemistry-aksara",title:"CHEMISTRY AKSARA JAWA",url:"https://kandangjagojawa.github.io/aksara-chemistry/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83E\uDDEA",desc:"Game jatuhkan aksara dan sandhangan agar bertabrakan dan bereaksi menjadi suku kata baru! Geser untuk mengarahkan, lepas atau tekan JATUHKAN. Selesaikan semua rumus yang ada! Seperti kimia sungguhan, Ha + Wulu = Hi, Ka + Suku = Ku - gabungkan elemen aksara dan lihat reaksinya meledak jadi kata baru! Seru, bikin nagih, dan diam-diam hapal aksara!",gradient:"linear-gradient(135deg,#0D1B2A,#00BFA5)",solid:"#0D1B2A",solid2:"#00BFA5",aksara:"ꦏꦶꦩꦶꦪ",cta:"Mulai Reaksi →",isNew:!0,note:"Jatuhkan aksara & sandhangan agar bertabrakan jadi suku kata baru. Geser, lepas, JATUHKAN! Selesaikan rumusnya!"},{id:"kartu-memori",title:"KARTU MEMORI",url:"https://kandangjagojawa.github.io/kartu-memori/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83C\uDFB4",desc:"Game mencocokkan kartu untuk melatih ingatan dan kecepatan berpikir! Balik dua kartu, cari pasangan aksara Jawa yang sama. Semakin cepat mencocokkan semua pasangan, semakin tinggi skormu! Cocok untuk melatih konsentrasi, ingatan, sekaligus hapal bentuk aksara Jawa tanpa terasa seperti belajar. Main sendiri atau tantang teman!",gradient:"linear-gradient(135deg,#6A1B9A,#F06292)",solid:"#6A1B9A",solid2:"#F06292",aksara:"ꦩꦼꦩꦺꦴꦫꦶ",cta:"Main Memori →",isNew:!0,note:"Cocokkan pasangan kartu aksara yang sama! Latih ingatan, konsentrasi, dan hapal aksara dalam satu game seru."},{id:"alih-aksara-kawi",title:"ALIH AKSARA LATIN - KAWI",url:"https://kandangjagojawa.github.io/alih-aksara-kawi/",secondaryUrl:"https://kandangjagojawa.github.io/latin-ke-kawi/",secondaryTitle:"Latin ke Kawi V2",tags:["AKSARA","BAHASA","EDUKASI"],icon:"\uD83C\uDFDB️",desc:"Alih aksara keren dari huruf Latin ke Aksara Kawi! Ketik Latin, langsung jadi aksara Kawi kuno yang gagah. Tata tulis sudah sesuai dengan tata tulis aksara Kawi asli - bukan asal convert! Rasakan sensasi menulis seperti pujangga zaman Mataram Kuno, prasasti-prasasti bersejarah hidup kembali di ujung jarimu!",gradient:"linear-gradient(135deg,#1A1A2E,#16213E)",solid:"#1A1A2E",solid2:"#16213E",aksara:"ꦏꦮꦶ",cta:"Alih ke Kawi V1 →",isNew:!0,note:"Latin ke Aksara Kawi asli - tata tulis sesuai kaidah Kawi kuno, prasasti hidup kembali!"},{id:"hapal-pasangan-kawi",title:"MENGHAPAL PASANGAN KAWI",url:"https://kandangjagojawa.github.io/hapal-pasangan-kawi/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83D\uDCDC\uD83D\uDD17",desc:"Sama serunya dengan MENGHAPAL PASANGAN, tapi sekarang ver
