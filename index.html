ote:"Akan memberitahu kamu titisan siapa atau siapakah tokoh yang bersemayam dalam dirimu dalam bahasa Jawa - versi Indonesia: Titisan Tokoh"},{id:"duel-aksara",title:"DUEL AKSARA",url:"https://kandangjagojawa.github.io/duel-aksara/",tags:["AKSARA","EDUKASI","GAME"],icon:"⚔️",desc:"Duel dua orang dengan 1 HP untuk menebak siapa paling cepat menjawab dalam waktu 5 detik. Cepat-cepatan adu kecepatan dan ketepatan mengenal aksara Jawa! Siapa yang paling cepat, dia yang menang!",gradient:"linear-gradient(135deg,#B71C1C,#EF5350)",solid:"#B71C1C",solid2:"#EF5350",aksara:"ꦢꦸꦮꦼꦭ꧀",cta:"Mulai Duel →",note:"Game duel 2 orang 1 HP, tebak siapa paling cepat menjawab dalam 5 detik - cepat-cepatan!"},{id:"dora-sembada",title:"DORA SEMBADA",url:"https://kandangjagojawa.github.io/rora-sembara/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83C\uDFF9",desc:"Satu HP untuk dua orang, salah baca aksara Jawa sedikit saja temanmu bisa benar-benar mati. Berani tidak membuktikan seberapa setia kamu dan bestie-mu seperti tragedi Dora dan Sembada yang melahirkan Hanacaraka?",gradient:"linear-gradient(135deg,#212121,#B71C1C)",solid:"#212121",solid2:"#B71C1C",aksara:"ꦢꦺꦴꦫꦱꦼꦩ꧀ꦧꦢ",cta:"Buktikan Kesetiaan →",note:"Satu HP untuk dua orang - salah baca aksara temanmu bisa mati. Seberapa setia kamu seperti Dora dan Sembada?"},{id:"tarik-tambang",title:"TARIK TAMBANG",url:"https://kandangjagojawa.github.io/tarik-tambang/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83E\uDEA2",desc:"Satu HP untuk dua orang, siapa cepat menulis tali akan tertarik ke arahnya. Ada 3 level keseruan! Adu kecepatan menulis aksara Jawa dan buktikan siapa yang paling kuat menarik tambang!",gradient:"linear-gradient(135deg,#F57F17,#FFCA28)",solid:"#F57F17",solid2:"#FFCA28",aksara:"ꦠꦫꦶꦏ꧀",cta:"Mulai Tarik →",note:"Satu HP untuk dua orang, siapa cepat menulis tali akan tertarik ke arahnya. Ada 3 level."},{id:"alih-aksara-sriwedari",title:"ALIH AKSARA SRIWEDARI",url:"https://kandangjagojawa.github.io/paugeran-sriwedari/",tags:["AKSARA","BAHASA","BETA","EDUKASI"],icon:"\uD83D\uDD24",desc:"Aplikasi alih aksara atau transliterasi dari Latin ke Aksara Jawa menurut Paugeran Sriwedari. Masih dalam tahap penyempurnaan. Baca PETUNJUK PENULISAN untuk hasil transliterasi yang akurat sesuai kaidah klasik.",gradient:"linear-gradient(135deg,#0B3D2E,#2E7D32)",solid:"#0B3D2E",solid2:"#2E7D32",aksara:"ꦱꦿꦶꦮꦼꦢꦫꦶ",cta:"Coba Alih Aksara →",note:"Alih aksara Latin ke Aksara Jawa Paugeran Sriwedari - BETA - Masih dalam tahap penyempurnaan. Baca PETUNJUK PENULISAN."},{id:"tata-tulis-cara-kawi",title:"TATA TULIS CARA KAWI",url:"https://kandangjagojawa.github.io/cara-kawi/",tags:["AKSARA","BAHASA","EDUKASI"],icon:"\uD83D\uDCD6",desc:"Aplikasi alih aksara atau transliterasi dari Latin ke Aksara Jawa menurut Tata Tulis Cara Kawi yang diambil dari Buku berjudul Serat Mardi Kawi. Orang lalu salah kaprah menyebutnya sebagai Paugeran Mardikawi, ini sangat salah. Yang benar adalah menulis aksara Jawa menggunakan tata tulis cara Kawi. Masih dalam tahap penyempurnaan.",gradient:"linear-gradient(135deg,#2C1E0F,#BC6C25)",solid:"#2C1E0F",solid2:"#BC6C25",aksara:"ꦕꦫꦏꦮꦶ",cta:"Coba Cara Kawi →",note:"Transliterasi Latin ke Aksara Jawa Cara Kawi dari Serat Mardi Kawi - bukan Paugeran Mardikawi yang salah kaprah. Masih penyempurnaan."},{id:"kamus-web",title:"KAMUS WEB",url:"https://kandangjagojawa.github.io/kamus-jawa/",tags:["BAHASA","BUDAYA","EDUKASI"],icon:"\uD83D\uDCDA",desc:"Kamus Indonesia - Jawa dan Jawa - Indonesia terlengkap! Cari makna kata dari A sampai Z, temukan padanan ngoko, krama, hingga krama inggil dengan mudah. Ketik kata, langsung dapat arti Jawa-nya! Cocok untuk belajar, nulis, dan ngobrol Jawa sehari-hari.",gradient:"linear-gradient(135deg,#0D2C54,#1E88E5)",solid:"#0D2C54",solid2:"#1E88E5",aksara:"ꦏꦩꦸꦱ꧀",cta:"Buka Kamus →",note:"Kamus Indonesia-Jawa dan sebaliknya, lengkap dengan abjad A-Z - dari ngoko hingga krama inggil!"},{id:"kamus-lengkap",title:"KAMUS LENGKAP",url:"https://kandangjagojawa.github.io/kamus-digit
