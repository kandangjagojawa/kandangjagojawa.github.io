asti Titisan →",note:"Akan memberitahu kamu titisan siapa atau siapakah tokoh yang bersemayam dalam dirimu dalam bahasa Jawa - versi Indonesia: Titisan Tokoh"},{id:"duel-aksara",title:"DUEL AKSARA",url:"https://kandangjagojawa.github.io/duel-aksara/",tags:["AKSARA","EDUKASI","GAME"],icon:"⚔️",desc:"Duel dua orang dengan 1 HP untuk menebak siapa paling cepat menjawab dalam waktu 5 detik. Cepat-cepatan adu kecepatan dan ketepatan mengenal aksara Jawa! Siapa yang paling cepat, dia yang menang!",gradient:"linear-gradient(135deg,#B71C1C,#EF5350)",solid:"#B71C1C",solid2:"#EF5350",aksara:"ꦢꦸꦮꦼꦭ꧀",cta:"Mulai Duel →",note:"Game duel 2 orang 1 HP, tebak siapa paling cepat menjawab dalam 5 detik - cepat-cepatan!"},{id:"dora-sembada",title:"DORA SEMBADA",url:"https://kandangjagojawa.github.io/rora-sembara/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83C\uDFF9",desc:"Satu HP untuk dua orang, salah baca aksara Jawa sedikit saja temanmu bisa benar-benar mati. Berani tidak membuktikan seberapa setia kamu dan bestie-mu seperti tragedi Dora dan Sembada yang melahirkan Hanacaraka?",gradient:"linear-gradient(135deg,#212121,#B71C1C)",solid:"#212121",solid2:"#B71C1C",aksara:"ꦢꦺꦴꦫꦱꦼꦩ꧀ꦧꦢ",cta:"Buktikan Kesetiaan →",note:"Satu HP untuk dua orang - salah baca aksara temanmu bisa mati. Seberapa setia kamu seperti Dora dan Sembada?"},{id:"tarik-tambang",title:"TARIK TAMBANG",url:"https://kandangjagojawa.github.io/tarik-tambang/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83E\uDEA2",desc:"Satu HP untuk dua orang, siapa cepat menulis tali akan tertarik ke arahnya. Ada 3 level keseruan! Adu kecepatan menulis aksara Jawa dan buktikan siapa yang paling kuat menarik tambang!",gradient:"linear-gradient(135deg,#F57F17,#FFCA28)",solid:"#F57F17",solid2:"#FFCA28",aksara:"ꦠꦫꦶꦏ꧀",cta:"Mulai Tarik →",note:"Satu HP untuk dua orang, siapa cepat menulis tali akan tertarik ke arahnya. Ada 3 level."},{id:"alih-aksara-sriwedari",title:"PAUGERAN SRIWEDARI",url:"https://kandangjagojawa.github.io/paugeran-sriwedari/", ithub.io/kamus-digital-jawa/",tags:["BAHASA","BUDAYA","EDUKASI"],icon:"\uD83D\uDDC2️",desc:"Berbeda dengan KAMUS WEB, aplikasi ini bisa mencari sembarang kata yang ditulis dalam Bahasa Indonesia ATAU Bahasa Jawa! Cari langsung dari 3 database kamus sekaligus - lebih lengkap, lebih pintar, lebih jangkau semua makna dari ngoko hingga krama inggil. Satu kata, tiga sumber, hasil maksimal!",gradient:"linear-gradient(135deg,#1A3C34,#43A047)",solid:"#1A3C34",solid2:"#43A047",aksara:"ꦏꦩꦸꦱ꧀ꦭꦼꦁꦏꦥ꧀",cta:"Buka Kamus Lengkap →",note:"Beda dengan KAMUS WEB - bisa cari kata Indonesia atau Jawa dari 3 database kamus sekaligus! Lebih lengkap dan pintar."},{id:"hapal-pasangan",title:"MENGHAPAL PASANGAN AKSARA JAWA",url:"https://kandangjagojawa.github.io/hapal-pasangan/",secondaryUrl:"https://kandangjagojawa.github.io/hapal-pasangan/index2.html",secondaryTitle:"Font Noto Sans Javanese",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83D\uDD17",desc:"Game khusus untuk menghapal pasangan aksara Jawa! Pasangan itu yang bikin bingung kan? Di game ini kamu akan ditempa hafal semua pasangan dari Pa sampai Ha, lengkap dengan aturan pemakaiannya. Main sambil hapal, lama-lama pasangan bukan lagi musuh tapi jadi sahabat nulis!",gradient:"linear-gradient(135deg,#4E342E,#FFAB91)",solid:"#4E342E",solid2:"#FFAB91",aksara:"ꦥꦱꦔꦤ꧀",cta:"Hapal Pasangan →",isNew:!0,note:"Game khusus untuk menghapal pasangan aksara Jawa - dari Pa sampai Ha, bikin pasangan jadi sahabat bukan musuh!"},{id:"chemistry-aksara",title:"CHEMISTRY AKSARA JAWA",url:"https://kandangjagojawa.github.io/aksara-chemistry/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83E\uDDEA",desc:"Game jatuhkan aksara dan sandhangan agar bertabrakan dan bereaksi menjadi suku kata baru! Geser untuk mengarahkan, lepas atau tekan JATUHKAN. Selesaikan semua rumus yang ada! Seperti kimia sungguhan, Ha + Wulu = Hi, Ka + Suku = Ku - gabungkan elemen aksara dan lihat reaksinya meledak jadi kata baru! Seru, bikin nagih, dan diam-diam hapal aksara!",gradient:"linear-gradient(135deg,#0D1B2A,#00BFA5)",solid:"#0D1B2A",solid2:"#00BFA5",aksara:"ꦏꦶꦩꦶꦪ",cta:"Mulai Reaksi →",isNew:!0,note:"Jatuhkan aksara & sandhangan agar bertabrakan jadi suku kata baru. Geser, lepas, JATUHKAN! Selesaikan rumusnya!"},{id:"kartu-memori",title:"KARTU MEMORI",url:"https://kandangjagojawa.github.io/kartu-memori/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83C\uDFB4",desc:"Game mencocokkan kartu untuk melatih ingatan dan kecepatan berpikir! Balik dua kartu, cari pasangan aksara Jawa yang sama. Semakin cepat mencocokkan semua pasangan, semakin tinggi skormu! Cocok untuk melatih konsentrasi, ingatan, sekaligus hapal bentuk aksara Jawa tanpa terasa seperti belajar. Main sendiri atau tantang teman!",gradient:"linear-gradient(135deg,#6A1B9A,#F06292)",solid:"#6A1B9A",solid2:"#F06292",aksara:"ꦩꦼꦩꦺꦴꦫꦶ",cta:"Main Memori →",isNew:!0,note:"Cocokkan pasangan kartu aksara yang sama! Latih ingatan, konsentrasi, dan hapal aksara dalam satu game seru."},{id:"alih-aksara-kawi",title:"ALIH AKSARA LATIN - KAWI",url:"https://kandangjagojawa.github.io/alih-aksara-kawi/",secondaryUrl:"https://kandangjagojawa.github.io/latin-ke-kawi/",secondaryTitle:"Latin ke Kawi V2",tags:["AKSARA","BAHASA","EDUKASI"],icon:"\uD83C\uDFDB️",desc:"Alih aksara keren dari huruf Latin ke Aksara Kawi! Ketik Latin, langsung jadi aksara Kawi kuno yang gagah. Tata tulis sudah sesuai dengan tata tulis aksara Kawi asli - bukan asal convert! Rasakan sensasi menulis seperti pujangga zaman Mataram Kuno, prasasti-prasasti bersejarah hidup kembali di ujung jarimu!",gradient:"linear-gradient(135deg,#1A1A2E,#16213E)",solid:"#1A1A2E",solid2:"#16213E",aksara:"ꦏꦮꦶ",cta:"Alih ke Kawi V1 →",isNew:!0,note:"Latin ke Aksara Kawi asli - tata tulis sesuai kaidah Kawi kuno, prasasti hidup kembali!"},{id:"hapal-pasangan-kawi",title:"MENGHAPAL PASANGAN KAWI",url:"https://kandangjagojawa.github.io/hapal-pasangan-kawi/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83D\uDCDC\uD83D\uDD17",desc:"Sama serunya dengan MENGHAPAL PASANGAN, tapi sekarang versi KAWI! Taklukkan pasangan aksara Kawi yang lebih kuno dan menantang - dari prasasti ke prasasti, dari kerajaan ke kerajaan! Kalau kamu sudah jago pasangan Jawa, buktikan kehebatanmu di level dewa: Pasangan Kawi! Main sambil jadi epigrapher, lama-lama baca prasasti kuno tanpa kamus!",gradient:"linear-gradient(135deg,#2C1810,#8E24AA)",solid:"#2C1810",solid2:"#8E24AA",aksara:"ꦥꦱꦔꦤ꧀ꦏꦮꦶ",cta:"Hapal Pasangan Kawi →",isNew:!0,note:"Versi Kawi dari game hapal pasangan - taklukkan pasangan aksara Kawi kuno, level dewa untuk pembaca prasasti!"},{id:"takdir-kraton",title:"TAKDIR KRATON",url:"https://kandangjagojawa.github.io/takdir-kraton/",tags:["BUDAYA","GAME"],icon:"\uD83D\uDC51",desc:"Penasaran jadi apa kamu kalau hidup di zaman Kerajaan Kuno Nusantara? Game Takdir Kraton akan membongkar takdirmu! Apakah kamu seorang Prajurit gagah penjaga kerajaan, Pujangga istana, Pedagang kaya, Petani, Empu pembuat keris sakti, atau bahkan Raja? Masukkan namamu, putar roda takdir, dan lihat pekerjaanmu di era Majapahit, Mataram, Singasari! Seru, bikin ngakak, dan bikin bangga jadi keturunan Nusantara!",gradient:"linear-gradient(135deg,#4E2600,#FFC107)",solid:"#4E2600",solid2:"#FFC107",aksara:"ꦠꦏ꧀ꦢꦶꦂ",cta:"Cek Takdirmu →",isNew:!0,note:"Cek takdirmu di zaman Kerajaan Kuno! Jadi Prajurit, Empu, Pedagang, atau Raja? Putar roda takdir kraton!"},{id:"alih-aksara-kbj",title:"PAUGERAN KBJ",url:"https://kandangjagojawa.github.io/kbj/",tags:["AKSARA","BAHASA","EDUKASI"],icon:"\uD83D\uDCD8",desc:"Alih aksara Latin ke Aksara Jawa berdasarkan Paugeran KBJ 1996! Hasil Kongres Bahasa Jawa di Malang yang disepakati 3 Gubernur Jateng-Jatim-DIY. Paugeran yang dipakai di sekolah - lebih sederhana, konsisten, mudah dipelajari. Cocok untuk pelajar & umum yang mau nulis aksara Jawa sesuai standar resmi! Ketik Latin, langsung jadi aksara Jawa KBJ yang benar!",gradient:"linear-gradient(135deg,#1565C0,#64B5F6)",solid:"#1565C0",solid2:"#64B5F6",aksara:"ꦏꦨꦗ",cta:"Alih KBJ →",isNew:!0,note:"Standar resmi KBJ 1996 Kongres Bahasa Jawa Malang - SKB 3 Gubernur, paugeran sekolah!"},{id:"komparasi",title:"MEMBANDINGKAN 3 TATA TULIS",url:"https://kandangjagojawa.github.io/komparasi/",tags:["AKSARA","BAHASA","EDUKASI"],icon:"⚖️",desc:"Bingung bedanya Sriwedari, KBJ, dan Mardi Kawi? Aplikasi ini membandingkan 3 tata tulis aksara Jawa sekaligus dalam satu layar! Ketik satu kalimat Latin, langsung lihat hasilnya dalam Paugeran Sriwedari 1926 (klasik Solo), Paugeran KBJ 1996 (standar sekolah resmi SKB 3 Gubernur), dan Mardi Kawi (gaya Kawi kuno). Bandingkan sandhangan, pasangan, murda - mana yang paling cocok untukmu? Wajib untuk peneliti, guru, dan pecinta aksara!",gradient:"linear-gradient(135deg,#102027,#FF6F00)",solid:"#102027",solid2:"#FF6F00",aksara:"ꦧꦤ꧀ꦝꦶꦁ",cta:"Bandingkan →",isNew:!0,note:"Bandingkan Sriwedari vs KBJ vs Mardi Kawi dalam satu layar - ketik sekali, lihat 3 versi!"},{id:"morfologi-jawa",title:"MEMBENTUK KATA BERIMBUHAN",url:"https://kandangjagojawa.github.io/morfologi-jawa/",tags:["AKSARA","BAHASA","EDUKASI"],icon:"\uD83D\uDEE0️",desc:"Pusing bedain di- + tulis vs ditulis dalam aksara Jawa? Aplikasi Morfologi Jawa solusinya! Tulis kata dasar, pilih ater-ater (awalan) seperti di-, ke-, pi- dan panambang (akhiran) -an, -ake, -en, langsung jadi kata turunan lengkap! Lihat hasilnya sekaligus dalam Paugeran KBJ 1996 dan Sriwedari 1926. Tidak perlu hafal rumus pasangan berubah! Dari ng- + gawa jadi nggawa, sa- + omah jadi saomah - semua otomatis sesuai paugeran. Wajib untuk guru, pelajar, dan yang masih bingung nulis tembung andhahan!",gradient:"linear-gradient(135deg,#1B2A4A,#2E7D32)",solid:"#1B2A4A",solid2:"#2E7D32",aksara:"ꦩꦺꦴꦂꦥ꦳ꦺꦴꦭꦺꦴꦒꦶ",cta:"Bentuk Kata →",isNew:!0,note:"Tulis kata dasar + pilih ater-ater & panambang → jadi aksara Jawa KBJ & Sriwedari otomatis!"},{id:"pitutur-aksara-jawa",title:"PITUTUR AKSARA JAWA",url:"https://kandangjagojawa.github.io/pitutur-aksara-jawa/",tags:["AKSARA","BAHASA","BUDAYA","EDUKASI","PITUTUR"],icon:"\uD83D\uDCDC",desc:"Kumpulan pitutur luhur Jawa kini dalam aksara Jawa asli! Cari dengan kata kunci atau pilih dari daftar pitutur - langsung tampil pitutur lengkap plus aksara Jawanya dalam 3 tata tulis sekaligus: Paugeran KBJ 1996 (standar sekolah), Paugeran Sriwedari 1926 (klasik), dan Cara Kawi (Mardi Kawi). Dari 'urip iku urup' sampai 'becik ketitik ala ketara' - semua ada! Cocok untuk belajar pitutur sambil mahir aksara Jawa. Bijak, edukatif, dan nguri-uri budaya!",gradient:"linear-gradient(135deg,#3E2723,#A1887F)",solid:"#3E2723",solid2:"#A1887F",aksara:"ꦥꦶꦠꦸꦠꦸꦂꦗꦮ",cta:"Baca Pitutur →",isNew:!0,note:"Cari pitutur → tampil aksara Jawa 3 versi: KBJ, Sriwedari, Mardi Kawi sekaligus!"},{id:"tetris-aksara",title:"TETRIS AKSARA JAWA",url:"https://kandangjagojawa.github.io/tetris/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83E\uDDF1",desc:"Game Tetris klasik kini versi Aksara Jawa! Balok-balok aksara Jawa berjatuhan dari atas - susun dengan cepat menjadi kata bahasa Jawa sesuai target! Ada target kata di atas layar, kamu harus menyusun balok aksara yang jatuh jadi kata yang diminta sebelum menumpuk! Dari kata sederhana seperti omah, banyu, srengenge sampai kata Jawa lainnya - semua jadi tantangan! Makin cepat, makin seru - reflex dan hafalan aksara diuji! Main sambil hapal aksara tanpa sadar - nagih banget!",gradient:"linear-gradient(135deg,#0D47A1,#00E5FF)",solid:"#0D47A1",solid2:"#00E5FF",aksara:"ꦠꦼꦠꦿꦶꦱ꧀",cta:"Main Tetris →",isNew:!0,note:"Target kata di atas, balok aksara jatuh - susun cepat jadi kata Jawa! Reflex + hapalan aksara!"},{id:"tts-aksara-jawa",title:"TTS AKSARA JAWA",url:"https://kandangjagojawa.github.io/tts/",tags:["AKSARA","EDUKASI","GAME"],icon:"\uD83D\uDCDD",desc:"TTS paling Jawa se-Nusantara! Isi teka-teki silang pakai keyboard aksara Jawa khusus - bukan keyboard Latin biasa! Ketik langsung aksara Jawa di kotak TTS, seru abis! Soalnya tentang bahasa, budaya, dan kehidupan Jawa sehari-hari. Dan... ssstt, ada bocoran kunci jawaban dalam kurung di setiap soal
